name: Benchmark freshness alert
on:
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmark-freshness
  cancel-in-progress: false
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check bundled fallback age
        run: node scripts/check-benchmark-freshness.mjs --max-age-days 7 --strict
      - name: Check production snapshot
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://www.buildnscale.dev/api/benchmarks/freshness', {
            headers: { accept: 'application/json' },
          })
          if (!response.ok) {
            throw new Error(`Freshness endpoint returned HTTP ${response.status}`)
          }
          const data = await response.json()
          console.log(JSON.stringify(data, null, 2))
          if (data.storage !== 'database') {
            throw new Error(
              `Public leaderboard is serving ${data.storage} data. Check DATABASE_URL and the BenchmarkSnapshot table.`
            )
          }
          if (data.checkOverdue) {
            throw new Error(
              `No successful benchmark check since ${data.lastCheckedAt}. Run the refresh workflow and inspect its logs.`
            )
          }
          if (data.publicationOld) {
            console.warn(
              `Arena has not published a newer included board since ${data.sourceUpdatedAt}; a recent check does not make that data new.`
            )
          }
          console.log(`Freshness confirmed: ${data.revision}, checked ${data.lastCheckedAt}`)
          NODE
