name: Refresh benchmark snapshots
on:
  schedule:
    - cron: '25 */4 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: benchmark-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify import configuration
        env:
          IMPORTS_ENABLED: ${{ vars.BNS_BENCHMARK_IMPORTS_ENABLED }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured. Add the same secret used by the Vercel deployment."
            exit 1
          fi
          if [ "$IMPORTS_ENABLED" != "true" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::warning::BNS_BENCHMARK_IMPORTS_ENABLED is not 'true'. Manual dispatch will still attempt the authenticated import."
            else
              echo "::error::Scheduled benchmark imports are disabled. Set repository variable BNS_BENCHMARK_IMPORTS_ENABLED=true."
              exit 1
            fi
          fi
      - name: Import permitted benchmark sources
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          AA_ENABLED: ${{ vars.BNS_AA_IMPORT_ENABLED }}
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 300 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            'https://www.buildnscale.dev/api/benchmarks/refresh?source=arena')
          echo "$response"
          node -e '
            const result = JSON.parse(process.argv[1])
            if (result.source !== "arena" || !/^[a-f0-9]{40}$/.test(result.revision || "") || !Number.isInteger(result.models) || result.models < 2) {
              console.error("Unexpected import response", result)
              process.exit(1)
            }
            console.log(`Imported Arena revision ${result.revision} with ${result.models} evaluated labels`)
          ' "$response"
          if [ "$AA_ENABLED" = 'true' ]; then
            curl --fail-with-body --silent --show-error --max-time 300 --request POST \
              --header "Authorization: Bearer $CRON_SECRET" \
              'https://www.buildnscale.dev/api/benchmarks/refresh?source=artificial-analysis'
          fi
      - name: Verify public freshness endpoint
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://www.buildnscale.dev/api/benchmarks/freshness', {
            headers: { accept: 'application/json' },
          })
          if (response.status === 404) {
            console.warn('Freshness endpoint returned HTTP 404. Deploy the current code, then rerun this workflow to verify storage.')
            process.exit(0)
          }
          if (!response.ok) {
            throw new Error(`Freshness endpoint returned HTTP ${response.status}`)
          }
          const data = await response.json()
          console.log(JSON.stringify(data, null, 2))
          if (data.storage !== 'database') {
            throw new Error(
              `Public leaderboard is serving ${data.storage} data, not a database snapshot. Check DATABASE_URL and BenchmarkSnapshot.`
            )
          }
          if (data.checkOverdue) {
            throw new Error(
              `No successful benchmark check since ${data.lastCheckedAt}. Inspect the import response and production logs.`
            )
          }
          console.log(`Freshness confirmed: ${data.revision}, checked ${data.lastCheckedAt}`)
          NODE
